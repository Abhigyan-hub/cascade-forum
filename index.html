<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Forum — Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a href="#" class="logo">College Forum</a>
        <p class="tagline">Campus events &amp; registrations</p>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrap hero-inner">
          <h1>Upcoming events</h1>
          <p class="lead">
            Browse what is happening on campus. Each Register button opens that
            event’s Google Form in a new tab.
          </p>
        </div>
      </section>

      <section class="events" aria-label="Event listings">
        <div class="wrap events-grid" id="events-root"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>College Forum — campus events</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
