<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascade Forum</title>
    <link
      rel="icon"
      href="assets/images/cascade%20logo.jpg"
      type="image/jpeg"
    />
    <link
      rel="apple-touch-icon"
      href="assets/images/cascade%20logo.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap nav-bar">
        <a href="#" class="logo js-dummy" aria-label="Cascade Forum home">
          <img
            class="logo-img"
            src="assets/images/cascade%20logo.jpg"
            width="40"
            height="40"
            alt=""
            decoding="async"
          />
          <span class="logo-text">Cascade Forum</span>
        </a>
        <nav class="nav-actions" aria-label="Account">
          <a href="#" class="nav-link js-dummy">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
            </svg>
            Login
          </a>
          <a href="#" class="btn btn-yellow btn-compact js-dummy">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Register
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero-band" aria-label="Welcome">
        <div class="wrap hero-inner">
          <h1>Welcome to Cascade Forum</h1>
          <p class="hero-sub">Discover and register for exciting events. NO LOGIN REQUIRED</p>
          <div class="hero-actions">
            <a href="#" class="btn btn-yellow js-dummy">Get Started</a>
            <a href="#" class="btn btn-ghost js-dummy">Sign In</a>
          </div>
        </div>
      </section>

      <section class="events-section" aria-labelledby="active-events-heading">
        <div class="wrap">
          <h2 id="active-events-heading" class="section-title">Active Events</h2>
          <div class="events-grid" id="events-root"></div>
        </div>
      </section>

      <!-- <section class="cta-section" aria-label="Account call to action">
        <div class="wrap">
          <div class="cta-card">
            <h3>Want to register for events?</h3>
            <p class="cta-text">
              C 
            </p>
            <a href="#" class="btn btn-yellow js-dummy">
              <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="22" y1="11" x2="16" y2="11"/>
              </svg>

          </div>
        </div>

    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>© 2026 Cascade Forum. All rights reserved.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
